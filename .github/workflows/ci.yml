name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Notes:
# - Each command is its own step: on Windows the default shell is PowerShell,
#   and a multi-line step only fails if its *last* command fails.
# - PYTHONUTF8 is deliberately NOT set, so Windows runs with its default
#   locale encoding and encoding bugs surface here rather than for users.
# - No secrets are used: every provider call in the test suite is mocked or
#   goes to a local fake server, so CI never spends API credits.

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest: Linux x86_64; macos-latest: Apple Silicon (arm64);
        # windows-latest: Windows Server (x86_64).
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # Intel Mac coverage.
          - os: macos-15-intel
            python: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install APEX CORE with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Show platform
        run: python -c "import platform, sys, locale; print(platform.platform(), platform.machine(), sys.version, locale.getpreferredencoding(False))"
      - name: apex --version
        run: apex --version
      - name: Run tests
        run: python -m pytest -v -ra

  minimum-versions:
    name: Test with lowest supported dependency versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip uv
      - run: python -m uv pip install --system --resolution lowest-direct -e ".[dev]"
      - run: python -m pip list
      - run: python -m pytest -q -ra

  package:
    name: Build and install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - name: Build sdist and wheel
        run: python -m build
      - name: Install the wheel into a clean virtual environment and run apex
        run: python scripts/smoke_install.py dist
